{# Shared settings sidebar. Set `ss_active` before including to highlight the
   current item, e.g. {% set ss_active = 'storage' %}{% include '_settings_sidebar.html' %} #}
<aside class="settings-sidebar">
    <div class="ss-title">Settings</div>
    <a href="{{ url_for('settings_page') }}" class="ss-link{{ ' active' if ss_active == 'overview' else '' }}"><i class="fas fa-gauge-high"></i><span>Overview</span></a>
    <a href="{{ url_for('index') }}" class="ss-link{{ ' active' if ss_active == 'templates' else '' }}"><i class="fas fa-layer-group"></i><span>Templates</span></a>
    <a href="{{ url_for('type_references_page') }}" class="ss-link{{ ' active' if ss_active == 'types' else '' }}"><i class="fas fa-icons"></i><span>Type Icons</span></a>
    <a href="{{ url_for('shops_page') }}" class="ss-link{{ ' active' if ss_active == 'shops' else '' }}"><i class="fas fa-store"></i><span>Shops</span></a>
    <a href="{{ url_for('search_by_image_page') }}" class="ss-link{{ ' active' if ss_active == 'search' else '' }}"><i class="fas fa-camera"></i><span>Search by Image</span></a>
    <a href="{{ url_for('duplicates') }}" class="ss-link{{ ' active' if ss_active == 'duplicates' else '' }}"><i class="fas fa-clone"></i><span>Duplicates</span></a>
    <a href="{{ url_for('storage_page') }}" class="ss-link{{ ' active' if ss_active == 'storage' else '' }}"><i class="fas fa-hard-drive"></i><span>Storage</span></a>
</aside>

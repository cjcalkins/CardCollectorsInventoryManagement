# Reproducible install set for Card Collector Inventory Manager.
#
#     pip install -r requirements.lock
#
# WHY THIS FILE EXISTS. requirements.txt states floors (>=) only, and a floor is not
# a constraint: resolving it today crosses SEVEN major-version boundaries above what
# those floors describe -- numpy 1->2, opencv 4->5, reportlab 4->5, cryptography
# 42->50, Pillow 10->12, networkx 2->3, plus rapidocr and onnxruntime which carried
# no constraint at all. Two people installing a year apart do not get the same app.
#
# HOW THIS WAS PRODUCED, so it can be redone rather than hand-edited: a clean venv,
# pip install -r requirements.txt, then pip freeze. It is the actual dependency
# closure of requirements.txt, not a copy of somebody's working directory. The set
# below was verified by importing app.py and running a route-level test suite
# against it, so these versions are known to run this application, not merely to
# resolve together. Generated on Python 3.10.12, 2026-08-05.
#
# NO --hash LINES, deliberately. Hashes pin the wheel, and wheels are
# platform-specific: a lock carrying x86-64 Linux hashes cannot be installed on the
# Raspberry Pi this app explicitly supports. Version pinning is what is portable
# here. Note what that means -- this gives reproducibility and a known-good set, it
# does NOT protect against a malicious re-release of a pinned version.
#
# To refresh: rm -rf .venv && python3 -m venv .venv && .venv/bin/pip install \
#   -r requirements.txt && .venv/bin/pip freeze > requirements.lock

